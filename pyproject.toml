[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmarket"
version = "1.0.0"
description = "Analiza la demanda real del mercado laboral remoto: qué piden las ofertas, por perfil."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ezra Gonzalez", email = "176021703+ApoloArgonaut@users.noreply.github.com" }]
keywords = ["job-market", "data-analysis", "career", "nlp", "labor-market"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
jobmarket = "jobmarket.cli:main"

[project.urls]
Homepage = "https://github.com/ApoloArgonaut/job-market-analyzer"
Repository = "https://github.com/ApoloArgonaut/job-market-analyzer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# lexicon.py es una tabla de datos: una entrada por línea se lee mejor que
# una partida en tres.
"src/jobmarket/lexicon.py" = ["E501"]
